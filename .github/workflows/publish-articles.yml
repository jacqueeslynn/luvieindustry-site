name: Publish two SEO articles

on:
  schedule:
    # GitHub scheduled workflows can be delayed or dropped during peak load.
    # Staggered retries are safe because the publisher exits after today's batch.
    - cron: "17 6 * * *"
    - cron: "17 9 * * *"
    - cron: "17 12 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview without publishing"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: daily-seo-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Fetch approved article source
        run: git fetch origin feature/seo-geo-content:refs/remotes/origin/feature/seo-geo-content
      - name: Publish next two articles
        run: node scripts/publish-next-articles.mjs ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
      - name: Check whether a batch was created
        id: changes
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate generated pages
        if: ${{ steps.changes.outputs.has_changes == 'true' }}
        run: |
          grep -q "luvieindustry.com/articles/" sitemap.xml
          grep -q "article-card" articles/index.html
      - name: Commit and publish
        if: ${{ steps.changes.outputs.has_changes == 'true' }}
        run: |
          git config user.name "Luvie Content Bot"
          git config user.email "actions@users.noreply.github.com"
          git add articles sitemap.xml
          git commit -m "content: publish next two buyer guides"
          git push origin main
