name: Site SEO quality check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate SEO and publishing rules
        run: |
          node scripts/audit-site-seo.mjs
          node --test scripts/publish-next-articles.test.mjs
